[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ds41-spark"
version = "0.1.0"
description = "Pinned DeepSeek V4.1 dual-Spark runtime integration and calibration"
requires-python = ">=3.11"

[project.entry-points."vllm.general_plugins"]
ds41 = "ds41.vllm_plugin:register"

[tool.setuptools]
packages = ["ds41"]
